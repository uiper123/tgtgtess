[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edutest-pro"
version = "1.4.7"
description = "Offline LAN exam-testing system with proctoring, dynamic UI scaling, and signed auto-updates"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "uiper123" }]
keywords = ["education", "testing", "exam", "proctoring", "PySide6", "Qt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education :: Testing",
]
dependencies = [
    "PySide6>=6.4,<7.0",
    "Pillow>=10.0,<12.0",
    "cryptography>=41,<46",
    "certifi>=2023.7.22",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "nuitka>=2.0",
]

[project.urls]
Homepage = "https://github.com/uiper123/tgtgtess"
Issues = "https://github.com/uiper123/tgtgtess/issues"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

# ---------------------------------------------------------------------------
# Ruff (formatter + linter)
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["build", "dist", "updates"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle (basic style)
    "F",            # pyflakes (real bugs: unused imports/vars, etc.)
    "I",            # isort (import sorting)
    "RUF",          # ruff-specific
]
ignore = [
    "E501",        # line too long — handled by formatter
    "E402",        # module import not at top — legit with pytest.importorskip
    "E722",        # bare except — used heavily in Qt slot handlers (legacy)
    # Проект намеренно русскоязычный, ruff не должен ругаться на кириллицу,
    # "похожую" на латиницу (е→e, о→o, …).
    "RUF001",      # ambiguous unicode character in string
    "RUF002",      # ambiguous unicode character in docstring
    "RUF003",      # ambiguous unicode character in comment
    "RUF012",      # mutable class attributes (Qt signal style)
    "RUF013",      # implicit Optional (codebase already mostly conforms)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841", "E402", "F401"]
"server/main.py" = ["B023"]
# server/ui_*.py намеренно ре-экспортируют диалоги из ui_dialogs для других модулей.
"server/ui_dashboard.py" = ["F401"]
"server/ui_exams.py" = ["F401", "F841"]
"server/ui_questions.py" = ["F401"]
"server/ui_results.py" = ["F401"]
"server/ui_server.py" = ["F401"]
"server/ui_settings.py" = ["F401"]
"client/main.py" = ["F841"]
"shared/styles.py" = ["RUF046"]
