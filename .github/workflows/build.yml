name: Build and Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka PySide6

      - name: Build with Nuitka
        run: python build_all.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile Installer (Inno Setup)
        run: |
          iscc build/student_setup.iss

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/server/TTGTiSO-Test-server.exe
            dist/student/TTGTiSO-Test-student.exe
            dist/EduTestStudent_Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          pip install nuitka PySide6

      - name: Build with Nuitka
        run: python build_all.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/server/TTGTiSO-Test-server
            dist/student/TTGTiSO-Test-student

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-linux

      - name: Prepare Binaries and Changelog
        id: prepare
        run: |
          tag="${{ github.ref_name }}"
          echo "Preparing release for tag: $tag"

          # 1. Переименовываем файлы с добавлением версии тега
          find dist-windows -name "TTGTiSO-Test-server.exe" -execdir mv {} "TTGTiSO-Test-server-$tag.exe" \;
          find dist-windows -name "TTGTiSO-Test-student.exe" -execdir mv {} "TTGTiSO-Test-student-$tag.exe" \;
          find dist-windows -name "EduTestStudent_Setup.exe" -execdir mv {} "EduTestStudent_Setup-$tag.exe" \;

          find dist-linux -name "TTGTiSO-Test-server" -execdir mv {} "TTGTiSO-Test-server-$tag" \;
          find dist-linux -name "TTGTiSO-Test-student" -execdir mv {} "TTGTiSO-Test-student-$tag" \;

          # 2. Извлекаем сообщение тега или коммита
          tag_message=$(git tag -l --format='%(contents)' "$tag" | xargs)
          if [ -z "$tag_message" ]; then
            tag_message=$(git log -1 --pretty=%B)
          fi

          echo "### 🚀 Релиз EduTest Pro $tag" > changelog.md
          echo "" >> changelog.md
          echo "#### 📝 Описание изменений:" >> changelog.md
          echo "$tag_message" >> changelog.md
          echo "" >> changelog.md
          echo "---" >> changelog.md
          echo "*Сборка выполнена автоматически с помощью GitHub Actions.*" >> changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.md
          generate_release_notes: true
          files: |
            dist-windows/**/*-${{ github.ref_name }}.exe
            dist-linux/**/*-${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
