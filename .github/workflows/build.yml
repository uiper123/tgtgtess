name: Build and Package

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka PySide6

      - name: Build with Nuitka
        run: python build_all.py

      - name: Compile Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build/student_setup.iss

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            dist/server/TTGTiSO-Test-server.exe
            dist/student/TTGTiSO-Test-student.exe
            dist/EduTestStudent_Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python -m pip install --upgrade pip
          pip install nuitka PySide6

      - name: Build with Nuitka
        run: python build_all.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            dist/server/TTGTiSO-Test-server
            dist/student/TTGTiSO-Test-student

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist-windows

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-windows/TTGTiSO-Test-server.exe
            dist-windows/TTGTiSO-Test-student.exe
            dist-windows/EduTestStudent_Setup.exe
            dist-linux/TTGTiSO-Test-server
            dist-linux/TTGTiSO-Test-student
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
